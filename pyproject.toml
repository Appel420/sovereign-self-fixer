[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "sovereign-self-fixer"
version = "0.4.0"
description = "Sovereign Self-Fixer with authority-bound PQC identity, encrypted key backups, and tamper-evident evidence logging"
authors = [{ name = "Derek Appel", email = "appel420@x.ai" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=45,<47",
    "blake3>=1,<2",
    "prometheus-client>=0.22,<1",
    "liboqs-python==0.16.0",
]

[project.scripts]
sovereign-self-fixer = "selffixerai.main:main"

[project.optional-dependencies]
vector = [
    "faiss-cpu>=1.8.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "sentence-transformers>=3.0.0,<6.0.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["selffixerai", "skills"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
