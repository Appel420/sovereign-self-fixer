name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate package metadata
        run: python -m pip check

      - name: Lint
        run: |
          python -m ruff check --fix --select E4,E7,E9,F selffixerai/ skills/ tests/
          python -m ruff check --select E4,E7,E9,F selffixerai/ skills/ tests/

      - name: Test
        run: python -m pytest tests/ -v

  build:
    name: Build Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build

      - name: Validate built artifacts
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import selffixerai; print(selffixerai.__name__)"
